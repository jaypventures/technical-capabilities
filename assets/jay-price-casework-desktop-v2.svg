<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="620" viewBox="0 0 1440 620" role="img" aria-label="Jay Price, personal engineering casework. Passing tests is not proof of a release: archived results show 41 authentication and authorization checks, 26 release contract tests, 5 evidence integrity tests passed while the overall release remained blocked."><rect width="1440" height="620" fill="#090a0f"/><defs><linearGradient id="edge" x1="0%" x2="100%" y1="0%" y2="0%"><stop stop-color="#ff93b5"/><stop offset=".2" stop-color="#f1a6b5"/><stop offset=".43" stop-color="#c7a0f8"/><stop offset=".68" stop-color="#a3b1ff"/><stop offset=".86" stop-color="#80c7ef"/><stop offset="1" stop-color="#8fdde8"/></linearGradient><linearGradient id="faint" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#141722"/><stop offset="1" stop-color="#0a0c12"/></linearGradient><pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#8795b1" stroke-opacity=".065"/></pattern></defs><rect width="1440" height="620" fill="url(#grid)"/><path d="M0 2H1440" stroke="url(#edge)" stroke-width="5"/><g font-family="Arial,Helvetica,sans-serif"><text x="72" y="82" font-size="17" fill="#c2ccdb" font-weight="700" letter-spacing="3.2">JAY PRICE   /   PERSONAL ENGINEERING CASEWORK</text><path d="M72 107H710" stroke="#354050"/><text x="68" y="250" font-size="78" fill="#eff2f7" font-weight="800" letter-spacing="-3.1">PASSING TESTS</text><text x="68" y="341" font-size="73" fill="#eff2f7" font-weight="800" letter-spacing="-2.9">ISN'T A RELEASE.</text><path d="M72 375H324" stroke="url(#edge)" stroke-width="4"/><text x="73" y="431" font-size="27" fill="#c3cfdd">The difference is in the evidence.</text><text x="74" y="542" font-size="15" fill="#a7b4ca" font-weight="700" letter-spacing="2">DECISIONS ARE ONLY AS GOOD AS THEIR PROOF.</text><rect x="803" y="80" width="560" height="461" fill="url(#faint)" stroke="#536077" stroke-opacity=".78" stroke-width="1.1"/><text x="828" y="123" font-size="15" fill="#acbdd5" font-weight="700" letter-spacing="1.8">SOURCE-REVIEWED  /  ARCHIVED RESULTS</text><path d="M828 145H1338" stroke="#526078" stroke-opacity=".75"/><text x="832" y="237" font-size="65" fill="#eff2f7" font-weight="800" letter-spacing="-2">41</text><text x="832" y="268" font-size="13" fill="#b1bed0" font-weight="700" letter-spacing="0.9">AUTH CHECKS</text><rect x="832" y="287" width="138" height="3" fill="#f4a1b8"/><text x="1007" y="237" font-size="65" fill="#eff2f7" font-weight="800" letter-spacing="-2">26</text><text x="1007" y="268" font-size="13" fill="#b1bed0" font-weight="700" letter-spacing="0.9">RELEASE TESTS</text><rect x="1007" y="287" width="138" height="3" fill="#bb9bfd"/><text x="1182" y="237" font-size="65" fill="#eff2f7" font-weight="800" letter-spacing="-2">05</text><text x="1182" y="268" font-size="13" fill="#b1bed0" font-weight="700" letter-spacing="0.9">INTEGRITY TESTS</text><rect x="1182" y="287" width="138" height="3" fill="#80ccec"/><path d="M828 322H1338" stroke="#485572"/><text x="830" y="369" font-size="15" fill="#b1bdcd" font-weight="700" letter-spacing="1.2">RELEASE DISPOSITION</text><text x="1337" y="413" font-size="60" fill="#ff9ba9" font-weight="800" letter-spacing="-1.1" text-anchor="end">BLOCKED</text><text x="830" y="470" font-size="17" fill="#c2cbd9">Passing checks did not establish deployment.</text><text x="829" y="510" font-size="12" fill="#97a7bf" letter-spacing="1.3">HISTORICAL ONLY  ·  NOT LIVE PRODUCTION PROOF</text></g></svg>