<svg xmlns="http://www.w3.org/2000/svg" width="720" height="700" viewBox="0 0 720 700" role="img" aria-label="Jay Price personal engineering portfolio. A custom PowerShell code composition demonstrates hash-based artifact verification and engineering precision."><defs><linearGradient id="spectrum" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#f7a9c3"/><stop offset=".27" stop-color="#d8a8ff"/><stop offset=".54" stop-color="#9fafff"/><stop offset=".78" stop-color="#7fc7ed"/><stop offset="1" stop-color="#9de4d1"/></linearGradient><linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff"/><stop offset=".55" stop-color="#e4eaf5"/><stop offset="1" stop-color="#afbed2"/></linearGradient><radialGradient id="g"><stop stop-color="#a58ef9" stop-opacity=".14"/><stop offset="1" stop-color="#8f75d7" stop-opacity="0"/></radialGradient><pattern id="grid" width="41" height="41" patternUnits="userSpaceOnUse"><path d="M41 0H0V41" stroke="#b6c8ea" stroke-opacity=".052" fill="none"/></pattern></defs><rect width="720" height="700" fill="#090a0f"/><rect width="720" height="700" fill="url(#grid)"/><rect width="720" height="700" fill="url(#g)"/><path d="M0 2H720" stroke="url(#spectrum)" stroke-width="5"/><text x="42" y="67" font-family="Arial,Helvetica,sans-serif" font-size="44" fill="url(#chrome)" font-weight="800" letter-spacing="1.2">JAY PRICE</text><text x="44" y="113" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#b7bfd3" letter-spacing="1.2">TECHNICAL WORK. DISCERNIBLE THINKING.</text><path d="M44 139H676" stroke="#354154"/><text x="41" y="190" font-family="Arial,Helvetica,sans-serif" font-size="37" fill="#e8ecf5" font-weight="800" letter-spacing="-0.4">MAKE THE EVIDENCE</text><text x="41" y="237" font-family="Arial,Helvetica,sans-serif" font-size="37" fill="#e8ecf5" font-weight="800" letter-spacing="-0.4">PART OF THE DESIGN.</text><rect x="40" y="292" width="658" height="362" fill="#c5a2fa" opacity=".045"/><rect x="31" y="281" width="658" height="362" fill="#10131c" stroke="#728099" stroke-opacity=".68" stroke-width="1.6"/><rect x="32" y="282" width="656" height="50" fill="#191d28"/><path d="M31 331H689" stroke="#41506a"/><circle cx="55" cy="307" r="4.2" fill="#eab1bf"/><circle cx="73" cy="307" r="4.2" fill="#b3a4e5"/><circle cx="91" cy="307" r="4.2" fill="#94d5cb"/><text x="120" y="314" font-family="Consolas,Menlo,Courier New,monospace" font-size="18" fill="#d3dcea">PowerShell 7  ·  artifact-integrity.ps1</text><text x="53" y="363" font-family="Consolas,Menlo,monospace" font-size="15" fill="#6c7993">01</text><text x="88" y="363" font-family="Consolas,Menlo,Courier New,monospace" font-size="19" xml:space="preserve"><tspan fill="#8693ab" xml:space="preserve"># Match the artifact to the intended revision</tspan></text><text x="53" y="403" font-family="Consolas,Menlo,monospace" font-size="15" fill="#6c7993">02</text><text x="88" y="403" font-family="Consolas,Menlo,Courier New,monospace" font-size="19" xml:space="preserve"><tspan fill="#c4b0ff" xml:space="preserve">param</tspan><tspan fill="#dfe7f4" xml:space="preserve">($Artifact, $ExpectedHash)</tspan></text><text x="53" y="443" font-family="Consolas,Menlo,monospace" font-size="15" fill="#6c7993">03</text><text x="88" y="443" font-family="Consolas,Menlo,Courier New,monospace" font-size="19" xml:space="preserve"><tspan fill="#f3accd" xml:space="preserve">$hash</tspan><tspan fill="#dfe7f4" xml:space="preserve"> = </tspan><tspan fill="#8ed8f4" xml:space="preserve">Get-FileHash</tspan><tspan fill="#f3accd" xml:space="preserve"> $Artifact</tspan><tspan fill="#dfe7f4" xml:space="preserve"> `</tspan></text><text x="53" y="483" font-family="Consolas,Menlo,monospace" font-size="15" fill="#6c7993">04</text><text x="88" y="483" font-family="Consolas,Menlo,Courier New,monospace" font-size="19" xml:space="preserve"><tspan fill="#c4b0ff" xml:space="preserve">  -Algorithm</tspan><tspan fill="#a9ead6" xml:space="preserve"> SHA256</tspan></text><text x="53" y="523" font-family="Consolas,Menlo,monospace" font-size="15" fill="#6c7993">05</text><text x="88" y="523" font-family="Consolas,Menlo,Courier New,monospace" font-size="19" xml:space="preserve"><tspan fill="#c4b0ff" xml:space="preserve">if</tspan><tspan fill="#dfe7f4" xml:space="preserve"> ($hash.Hash -ne $ExpectedHash) {</tspan></text><text x="53" y="563" font-family="Consolas,Menlo,monospace" font-size="15" fill="#6c7993">06</text><text x="88" y="563" font-family="Consolas,Menlo,Courier New,monospace" font-size="19" xml:space="preserve"><tspan fill="#c4b0ff" xml:space="preserve">  throw</tspan><tspan fill="#a9ead6" xml:space="preserve"> 'Artifact mismatch'</tspan></text><text x="53" y="603" font-family="Consolas,Menlo,monospace" font-size="15" fill="#6c7993">07</text><text x="88" y="603" font-family="Consolas,Menlo,Courier New,monospace" font-size="19" xml:space="preserve"><tspan fill="#dfe7f4" xml:space="preserve">}</tspan></text><path d="M53 600H667" stroke="#3f4b61" opacity=".8"/><text x="55" y="626" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#8ea0bc" letter-spacing="1.3">REVISION INTEGRITY  /  POWERSHELL</text><path d="M43 678H677" stroke="#65738b" opacity=".26"/></svg>