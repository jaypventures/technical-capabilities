<svg xmlns="http://www.w3.org/2000/svg" width="720" height="820" viewBox="0 0 720 820" role="img" aria-label="Jay Price, personal engineering casework. Passing tests is not proof of a release: archived results show 41 authentication and authorization checks, 26 release contract tests, 5 evidence integrity tests passed while the overall release remained blocked."><rect width="720" height="820" fill="#090a0f"/><defs><linearGradient id="edge" x1="0%" x2="100%" y1="0%" y2="0%"><stop stop-color="#ff93b5"/><stop offset=".2" stop-color="#f1a6b5"/><stop offset=".43" stop-color="#c7a0f8"/><stop offset=".68" stop-color="#a3b1ff"/><stop offset=".86" stop-color="#80c7ef"/><stop offset="1" stop-color="#8fdde8"/></linearGradient><linearGradient id="faint" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#141722"/><stop offset="1" stop-color="#0a0c12"/></linearGradient><pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#8795b1" stroke-opacity=".065"/></pattern></defs><rect width="720" height="820" fill="url(#grid)"/><path d="M0 2H720" stroke="url(#edge)" stroke-width="5"/><g font-family="Arial,Helvetica,sans-serif"><text x="43" y="64" font-size="18" fill="#c3cddd" font-weight="700" letter-spacing="3.4">JAY PRICE   /   ENGINEERING CASEWORK</text><path d="M43 87H676" stroke="#354050" stroke-width="1"/><text x="41" y="179" font-size="65" fill="#eff2f7" font-weight="800" letter-spacing="-2.7">PASSING TESTS</text><text x="41" y="252" font-size="63" fill="#eff2f7" font-weight="800" letter-spacing="-2.5">ISN'T A RELEASE.</text><path d="M44 280H254" stroke="url(#edge)" stroke-width="4"/><text x="44" y="331" font-size="26" fill="#cad2df">The difference is in the evidence.</text><rect x="42" y="377" width="636" height="344" rx="0" fill="url(#faint)" stroke="#556078" stroke-opacity=".7" stroke-width="1.2"/><text x="64" y="412" font-size="15" fill="#a6b8d3" font-weight="700" letter-spacing="2">SOURCE-REVIEWED  /  ARCHIVED RESULTS</text><path d="M64 434H654" stroke="#48526a" stroke-opacity=".65"/><text x="67" y="509" font-size="59" fill="#eff2f7" font-weight="800" letter-spacing="-1.7">41</text><text x="67" y="537" font-size="14" fill="#b5bfce" font-weight="700" letter-spacing="1">AUTH CHECKS</text><rect x="67" y="553" width="154" height="3" fill="#f4a1b8"/><text x="265" y="509" font-size="59" fill="#eff2f7" font-weight="800" letter-spacing="-1.7">26</text><text x="265" y="537" font-size="14" fill="#b5bfce" font-weight="700" letter-spacing="1">RELEASE TESTS</text><rect x="265" y="553" width="154" height="3" fill="#bb9bfd"/><text x="463" y="509" font-size="59" fill="#eff2f7" font-weight="800" letter-spacing="-1.7">05</text><text x="463" y="537" font-size="14" fill="#b5bfce" font-weight="700" letter-spacing="1">INTEGRITY TESTS</text><rect x="463" y="553" width="154" height="3" fill="#80ccec"/><path d="M64 580H654" stroke="#48526a" stroke-opacity=".7"/><text x="65" y="618" font-size="16" fill="#b5bfd1" font-weight="700" letter-spacing="1.6">RELEASE DISPOSITION</text><text x="655" y="625" font-size="41" fill="#ff9ba9" font-weight="800" letter-spacing="-0.8" text-anchor="end">BLOCKED</text><text x="65" y="680" font-size="18" fill="#c1cad7">Passing checks did not establish deployment.</text><text x="45" y="775" font-size="15" fill="#a1aec2" letter-spacing="1.3">HISTORICAL EVIDENCE  ·  NOT A LIVE RELEASE CLAIM</text><path d="M44 741H676" stroke="#384456"/></g></svg>