<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="560" viewBox="0 0 1440 560" role="img" aria-label="Jay Price personal engineering portfolio. A custom PowerShell code composition demonstrates hash-based artifact verification and engineering precision."><defs><linearGradient id="spectrum" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#f7a9c3"/><stop offset=".27" stop-color="#d8a8ff"/><stop offset=".54" stop-color="#9fafff"/><stop offset=".78" stop-color="#7fc7ed"/><stop offset="1" stop-color="#9de4d1"/></linearGradient><linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff"/><stop offset=".55" stop-color="#e4eaf5"/><stop offset="1" stop-color="#afbed2"/></linearGradient><radialGradient id="g"><stop stop-color="#a58ef9" stop-opacity=".14"/><stop offset="1" stop-color="#8f75d7" stop-opacity="0"/></radialGradient><pattern id="grid" width="41" height="41" patternUnits="userSpaceOnUse"><path d="M41 0H0V41" stroke="#b6c8ea" stroke-opacity=".052" fill="none"/></pattern></defs><rect width="1440" height="560" fill="#090a0f"/><rect width="1440" height="560" fill="url(#grid)"/><rect width="1440" height="560" fill="url(#g)"/><path d="M0 2H1440" stroke="url(#spectrum)" stroke-width="5"/><text x="76" y="82" font-family="Arial,Helvetica,sans-serif" font-size="27" fill="#dfe5f0" font-weight="800" letter-spacing="3">JAY PRICE</text><path d="M76 104H592" stroke="#3e485c"/><text x="71" y="217" font-family="Arial,Helvetica,sans-serif" font-size="65" fill="url(#chrome)" font-weight="800" letter-spacing="-1.4">MAKE THE</text><text x="71" y="292" font-family="Arial,Helvetica,sans-serif" font-size="65" fill="url(#chrome)" font-weight="800" letter-spacing="-1.4">EVIDENCE</text><text x="71" y="367" font-family="Arial,Helvetica,sans-serif" font-size="65" fill="url(#chrome)" font-weight="800" letter-spacing="-1.4">PART OF THE</text><text x="71" y="442" font-family="Arial,Helvetica,sans-serif" font-size="65" fill="url(#chrome)" font-weight="800" letter-spacing="-1.4">DESIGN.</text><path d="M77 471H311" stroke="url(#spectrum)" stroke-width="4"/><text x="77" y="515" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#b7bfd3">Engineering judgment, shown in the work.</text><rect x="649" y="85" width="729" height="420" fill="#c5a2fa" opacity=".045"/><rect x="640" y="74" width="729" height="420" fill="#10131c" stroke="#728099" stroke-opacity=".68" stroke-width="1.6"/><rect x="641" y="75" width="727" height="50" fill="#191d28"/><path d="M640 124H1369" stroke="#41506a"/><circle cx="664" cy="100" r="4.2" fill="#eab1bf"/><circle cx="682" cy="100" r="4.2" fill="#b3a4e5"/><circle cx="700" cy="100" r="4.2" fill="#94d5cb"/><text x="729" y="107" font-family="Consolas,Menlo,Courier New,monospace" font-size="18" fill="#d3dcea">PowerShell 7  ·  artifact-integrity.ps1</text><text x="665" y="178" font-family="Consolas,Menlo,monospace" font-size="16" fill="#6c7993">01</text><text x="700" y="178" font-family="Consolas,Menlo,Courier New,monospace" font-size="20" xml:space="preserve"><tspan fill="#8693ab" xml:space="preserve"># Match the artifact to the intended revision</tspan></text><text x="665" y="222" font-family="Consolas,Menlo,monospace" font-size="16" fill="#6c7993">02</text><text x="700" y="222" font-family="Consolas,Menlo,Courier New,monospace" font-size="20" xml:space="preserve"><tspan fill="#c4b0ff" xml:space="preserve">param</tspan><tspan fill="#dfe7f4" xml:space="preserve">($Artifact, $ExpectedHash)</tspan></text><text x="665" y="266" font-family="Consolas,Menlo,monospace" font-size="16" fill="#6c7993">03</text><text x="700" y="266" font-family="Consolas,Menlo,Courier New,monospace" font-size="20" xml:space="preserve"><tspan fill="#f3accd" xml:space="preserve">$hash</tspan><tspan fill="#dfe7f4" xml:space="preserve"> = </tspan><tspan fill="#8ed8f4" xml:space="preserve">Get-FileHash</tspan><tspan fill="#f3accd" xml:space="preserve"> $Artifact</tspan><tspan fill="#dfe7f4" xml:space="preserve"> `</tspan></text><text x="665" y="310" font-family="Consolas,Menlo,monospace" font-size="16" fill="#6c7993">04</text><text x="700" y="310" font-family="Consolas,Menlo,Courier New,monospace" font-size="20" xml:space="preserve"><tspan fill="#c4b0ff" xml:space="preserve">  -Algorithm</tspan><tspan fill="#a9ead6" xml:space="preserve"> SHA256</tspan></text><text x="665" y="354" font-family="Consolas,Menlo,monospace" font-size="16" fill="#6c7993">05</text><text x="700" y="354" font-family="Consolas,Menlo,Courier New,monospace" font-size="20" xml:space="preserve"><tspan fill="#c4b0ff" xml:space="preserve">if</tspan><tspan fill="#dfe7f4" xml:space="preserve"> ($hash.Hash -ne $ExpectedHash) {</tspan></text><text x="665" y="398" font-family="Consolas,Menlo,monospace" font-size="16" fill="#6c7993">06</text><text x="700" y="398" font-family="Consolas,Menlo,Courier New,monospace" font-size="20" xml:space="preserve"><tspan fill="#c4b0ff" xml:space="preserve">  throw</tspan><tspan fill="#a9ead6" xml:space="preserve"> 'Artifact mismatch'</tspan></text><text x="665" y="442" font-family="Consolas,Menlo,monospace" font-size="16" fill="#6c7993">07</text><text x="700" y="442" font-family="Consolas,Menlo,Courier New,monospace" font-size="20" xml:space="preserve"><tspan fill="#dfe7f4" xml:space="preserve">}</tspan></text><path d="M662 451H1347" stroke="#3f4b61" opacity=".8"/><text x="664" y="477" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#8ea0bc" letter-spacing="1.3">REVISION INTEGRITY  /  POWERSHELL</text><path d="M76 538H1369" stroke="#65738b" opacity=".26"/></svg>